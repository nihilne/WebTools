{% extends "base.html" %}
{% block title %}CSV Splitter{% endblock %}
{% block content %}
<h1 class="text-3xl">CSV Splitter</h1>
<p>Upload a CSV file and split it into multiple files.</p>
<form action="/csvsplitter/upload" method="POST" enctype="multipart/form-data" class="my-4 space-y-4">
    <input type="file" name="file" accept=".csv" class="block border p-2 rounded-lg" />
    <label class="flex items-center gap-2">
        <span>Rows per file:</span>
        <input type="number" name="chunk_size" value="50" min="1" class="border rounded px-2 py-1 w-24">
    </label>
    <label class="flex items-center gap-2">
        <input type="checkbox" name="has_header" value="1" checked>
        <span>Has header?</span>
    </label>
    <button type="submit"
        class="cursor-pointer px-4 py-2 bg-purple-600 text-white rounded-lg hover:scale-105 transition">
        Process
    </button>
</form>
<div id="output" class="my-4"></div>
{% endblock %}
