<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ASSETS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fontawesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/regular.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/solid.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/brands.min.css') }}">
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/main.min.js') }}" defer></script>
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.ico') }}">
    <script>
        // https://stackoverflow.com/questions/21147149/flash-of-unstyled-content-fouc-in-firefox-only-is-ff-slow-renderer
        let FF_FOUC_FIX;
    </script>
    <title>{% block title %}{% endblock %} | WebTools</title>
    <!-- EXTRAS (if any) -->
    {% block head_extra %}{% endblock %}
</head>

<body class="min-h-screen flex flex-col bg-off-white font-montserrat font-medium">
    <div class="flex flex-1">
        <div class="sidebar w-64 my-6 py-4 bg-main-red rounded-r-4xl shadow-xl text-white">
            <div class="flex justify-center gap-2">
                <a href="{{ url_for('settings_main.index') }}">
                    <i class="fa-solid fa-gear text-xl my-2 tool-icon"></i>
                </a>
                <a href="#" onclick="toggleDark()">
                    <i id="theme-icon" class="fa-solid fa-moon text-xl my-2 tool-icon"></i>
                </a>
            </div>
            <h1 class="text-3xl text-center font-bold"><a href="{{ url_for('main.index') }}">WebTools</a></h1>
            <p class=" text-center mb-4">{{ app_version }}</p>
            <nav class="space-y-3 mx-4">
                {% for item in nav_items %}
                {% if request.endpoint == item.endpoint %}
                <span class="block px-3 py-2 rounded-lg bg-darker-red scale-105">
                    {{ item.name }}
                </span>
                {% else %}
                <a href="{{ url_for(item.endpoint) }}"
                    class="block px-3 py-2 rounded-lg hover:bg-darker-red hover:scale-105 transition duration-75">
                    {{ item.name }}
                </a>
                {% endif %}
                {% endfor %}
            </nav>
        </div>
        <div class="flex-1 m-6 p-6 px-10 pt-10 rounded-4xl shadow-lg border border-gray-300 bg-blue-50">
            {% block content %}{% endblock %}
        </div>
    </div>
    <p class="text-lg text-center mt-1 mb-4">
        Created by <span class="text-main-red">NIHILNE</span>
    </p>
    <div class="text-lg text-center mb-4 flex justify-center gap-4">
        <a class="text-main-red underline" href="https://nihilne.com">
            <i class="fa-solid fa-globe text-2xl"></i>
        </a>
        <a class="text-main-red underline" href="https://github.com/nihilne/webtools">
            <i class="fa-brands fa-github text-2xl"></i>
        </a>
    </div>
</body>

</html>
